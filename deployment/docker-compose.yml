services:
  db:
    image: postgres:12
    environment:
      POSTGRES_USER: videoclub
      POSTGRES_PASSWORD: videoclubpassword
      POSTGRES_DB: videoclubdb
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoclub -d videoclubdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.8-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: no
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  # One-shot job: applies the SQL migrations before the services start.
  migrate:
    image: oven/bun:1
    working_dir: /app/packages/database
    command: ['bun', 'src/migrate.ts', 'up']
    volumes:
      - ..:/app
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: videoclubdb
      DATABASE_USER: videoclub
      DATABASE_PASSWORD: videoclubpassword
    depends_on:
      db:
        condition: service_healthy
    restart: no

  movies:
    image: oven/bun:1
    working_dir: /app
    command: ['bun', 'main.js']
    volumes:
      - ../packages/movies/dist/main.js:/app/main.js:ro
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: videoclubdb
      DATABASE_USER: videoclub
      DATABASE_PASSWORD: videoclubpassword
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: no

  rental:
    image: oven/bun:1
    working_dir: /app
    command: ['bun', 'main.js']
    volumes:
      - ../packages/rental/dist/main.js:/app/main.js:ro
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: videoclubdb
      DATABASE_USER: videoclub
      DATABASE_PASSWORD: videoclubpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: no

  pricing:
    image: oven/bun:1
    working_dir: /app
    command: ['bun', 'main.js']
    volumes:
      - ../packages/pricing/dist/main.js:/app/main.js:ro
    environment:
      NODE_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: videoclubdb
      DATABASE_USER: videoclub
      DATABASE_PASSWORD: videoclubpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: no

  accounting:
    image: oven/bun:1
    working_dir: /app
    command: ['bun', 'main.js']
    volumes:
      - ../packages/accounting/dist/main.js:/app/main.js:ro
    environment:
      NODE_ENV: development
      PORT: 4002
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: videoclubdb
      DATABASE_USER: videoclub
      DATABASE_PASSWORD: videoclubpassword
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: no

  frontend:
    image: nginx:alpine
    volumes:
      - ../packages/frontend/build:/usr/share/nginx/html:ro
      - ../packages/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: no

  caddy:
    image: caddy:2-alpine
    ports:
      - '5001:5001'
    volumes:
      - ../packages/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_logs:/data
    depends_on:
      - movies
      - rental
      - accounting
      - frontend
    restart: no
